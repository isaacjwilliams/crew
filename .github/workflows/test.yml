# Runs crew's suites on every pull request, whatever branch it targets, and on
# every push to main. The release workflow runs it too, before it publishes.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  # One job for each suite, so a red check names the suite that failed. lint
  # runs go test ./... too. It skips claude plugin validate and the fish syntax
  # check here, since the runner has neither claude nor fish.
  linux:
    # Only the public repo: a private crew home is a copy of it that pushes to
    # its own GitHub repo.
    if: github.repository == 'isaacjwilliams/crew'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [lint, guard, crew-e2e, host]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The suites need bash, git, jq, shellcheck and util-linux (flock,
      # setsid, script), which the runner has.
      - name: Run ${{ matrix.suite }}
        run: tests/run.sh ${{ matrix.suite }}

  # The shell suites need Linux. On a Mac, the Go tests check the parsing they
  # share with Linux, and that the macOS code builds and runs.
  macos:
    if: github.repository == 'isaacjwilliams/crew'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tests
        run: go test ./...
